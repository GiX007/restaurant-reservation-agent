<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Flow: a guest message goes to the agent; the agent reads the policy and calls tools, which read and write the customers and bookings database; unanswerable cases go to a person; the reply leads to the next turn.">
  <style>
    .line   { stroke: #57606a; fill: none; stroke-width: 1.6; }
    .box    { stroke: #57606a; fill: none; stroke-width: 1.6; }
    .panel  { stroke: #57606a; fill: none; stroke-width: 1.4; stroke-dasharray: 5 5; opacity: .55; }
    .dash   { stroke-dasharray: 6 5; }
    .dot    { stroke-dasharray: 2 5; opacity: .75; }
    .t      { fill: #1f2328; font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lg     { font-size: 16px; }
    .md     { font-size: 13px; }
    .sm     { font-size: 11.5px; opacity: .7; }
    .head   { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .line, .box, .panel { stroke: #8b949e; }
      .t    { fill: #e6edf3; }
      .head { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" class="head"/>
    </marker>
  </defs>

  <!-- what the agent reads and calls -->
  <rect class="panel" x="290" y="28" width="340" height="96" rx="10"/>
  <text class="t sm" x="460" y="48" text-anchor="middle">what it reads and calls</text>

  <rect class="box" x="300" y="62" width="110" height="50" rx="6"/>
  <text class="t md" x="355" y="84" text-anchor="middle">policy</text>
  <text class="t sm" x="355" y="100" text-anchor="middle">the rules</text>

  <rect class="box" x="420" y="62" width="200" height="50" rx="6"/>
  <text class="t md" x="520" y="84" text-anchor="middle">tools</text>
  <text class="t sm" x="520" y="100" text-anchor="middle">price · availability · read &amp; write</text>

  <!-- the database, outside the panel -->
  <path class="box" d="M 680 48 L 680 118 A 65 14 0 0 0 810 118 L 810 48"/>
  <ellipse class="box" cx="745" cy="48" rx="65" ry="14"/>
  <text class="t md" x="745" y="80" text-anchor="middle">customers</text>
  <text class="t md" x="745" y="98" text-anchor="middle">bookings</text>
  <text class="t sm" x="745" y="152" text-anchor="middle">the database</text>

  <path class="line" d="M 622 86 L 674 86" marker-end="url(#a)"/>

  <!-- main row -->
  <rect class="box" x="24"  y="177" width="160" height="56" rx="28"/>
  <text class="t lg" x="104" y="211" text-anchor="middle">guest message</text>

  <rect class="box" x="380" y="170" width="160" height="70" rx="8"/>
  <text class="t lg" x="460" y="211" text-anchor="middle">agent</text>

  <rect class="box" x="736" y="177" width="160" height="56" rx="28"/>
  <text class="t lg" x="816" y="211" text-anchor="middle">reply</text>

  <!-- human -->
  <rect class="box" x="380" y="300" width="160" height="48" rx="24"/>
  <text class="t md" x="460" y="329" text-anchor="middle">a person</text>

  <!-- arrows -->
  <path class="line" d="M 184 205 L 372 205" marker-end="url(#a)"/>
  <path class="line" d="M 548 205 L 728 205" marker-end="url(#a)"/>
  <path class="line" d="M 460 162 L 460 124" marker-end="url(#a)"/>
  <path class="line dash" d="M 460 248 L 460 292" marker-end="url(#a)"/>
  <text class="t sm" x="472" y="274">no rule covers it</text>

  <path class="line dot" d="M 816 241 C 816 460, 104 460, 104 241" marker-end="url(#a)"/>
  <text class="t sm" x="460" y="390" text-anchor="middle">next turn</text>
</svg>
